 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<title>Readify — An Online Book Store</title>
<style>
:root{--bg:#fbfbf9;--sf:#f2f2ee;--ink:#1c1f1d;--mut:#6b716d;--ac:#2f5d50;--acink:#fff;--line:#e4e5e0;--serif:"Newsreader",Georgia,serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--sf:#1d2320;--ink:#ecefeb;--mut:#9ba39e;--ac:#7fc0aa;--acink:#0d1512;--line:#2b332f}}
:root[data-theme="dark"]{--bg:#141816;--sf:#1d2320;--ink:#ecefeb;--mut:#9ba39e;--ac:#7fc0aa;--acink:#0d1512;--line:#2b332f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:-.01em}a{color:inherit}:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav{max-width:1040px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:4px;position:relative}
.logo{font:500 1.5rem var(--serif);text-decoration:none;margin-right:auto}
.links{display:flex;gap:2px;align-items:center}.links a{padding:6px 12px;text-decoration:none;color:var(--mut);font-size:.92rem}.links a:hover,.links a.on{color:var(--ink)}
.badge{background:var(--ink);color:var(--bg);border-radius:10px;font-size:.7rem;padding:1px 7px;margin-left:5px}
#burger{display:none;font:inherit;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
@media(max-width:760px){#burger{display:block}.links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--bg);padding:8px 24px 16px;border-bottom:1px solid var(--line)}.links.open{display:flex}}
main{max-width:1040px;margin:0 auto;padding:0 24px 72px}
.hero{padding:88px 0 56px;max-width:600px;margin:0}.hero h1{font-size:clamp(2.4rem,6vw,3.6rem);line-height:1.08;margin-bottom:14px}.hero p{color:var(--mut);font-size:1.05rem;margin:0 0 24px}
.hero form{display:flex;gap:8px;max-width:460px}
.btn{font:500 .88rem var(--sans);padding:10px 20px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;text-decoration:none;display:inline-block}
.btn.o{background:transparent;color:var(--ink);border-color:var(--line)}.btn.s{padding:6px 12px;font-size:.8rem}.btn:hover{opacity:.85}
h2.t{font-size:1.7rem;margin:80px 0 24px}
.cats{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:6px 16px;border:1px solid var(--line);background:transparent;color:var(--mut);font:400 .88rem var(--sans);cursor:pointer;text-decoration:none;border-radius:999px;display:inline-block}.chip:hover{color:var(--ink)}.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:32px 24px}
.card{display:flex;flex-direction:column}
.cv{aspect-ratio:2/3;text-decoration:none;color:#fff;padding:18px;border-radius:6px;background:linear-gradient(155deg,hsl(var(--h) 22% 42%),hsl(var(--h) 25% 28%));display:flex;flex-direction:column;justify-content:flex-end;gap:6px;box-shadow:0 8px 20px -10px rgba(0,0,0,.35);transition:transform .25s}
.card:hover .cv{transform:translateY(-3px)}.art{width:52%;margin:6px auto auto;fill:none;stroke:#fff;stroke-width:2.5;stroke-opacity:.8;stroke-linejoin:round;stroke-linecap:round}.row .art{display:none}.cv b{font:500 1.1rem/1.2 var(--serif)}.cv i{font-size:.72rem;opacity:.8;font-style:normal}
.ci{padding:12px 0 0;display:grid;gap:2px;flex:1;align-content:start}.ci h3{font:500 .95rem var(--sans)}.ci p{margin:0;color:var(--mut);font-size:.82rem}.pr{font-weight:500;color:var(--ac)}.ci .r{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.bar{display:flex;gap:8px;margin-bottom:16px}input,textarea{font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}.bar input{flex:1}
.det{display:grid;grid-template-columns:minmax(200px,280px) 1fr;gap:48px;padding-top:48px}@media(max-width:680px){.det{grid-template-columns:1fr;gap:28px}}.det h1{font-size:clamp(2rem,5vw,2.8rem);margin:8px 0}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.row .cv{padding:4px;font-size:.5rem;box-shadow:none}.row .cv b{font-size:.5rem}.row .cv i{display:none}
.q{display:inline-flex;align-items:center;gap:10px;margin-top:6px}.q button{width:28px;height:28px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--ink);cursor:pointer}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
.total{display:flex;justify-content:space-between;font:500 1.4rem var(--serif);margin:20px 0}
.f{display:grid;gap:16px;max-width:480px}.f label{display:grid;gap:6px;font-weight:500;font-size:.9rem}.msg{padding:12px 14px;border-radius:8px;background:var(--sf)}.msg.bad{color:#b3382c}
.empty{text-align:center;color:var(--mut);padding:64px 12px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:32px}.three div{color:var(--mut)}.three h3{font-size:1.15rem;margin-bottom:6px;color:var(--ink)}
.offer{text-align:center;color:var(--mut);font-size:.88rem;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.gc{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.gc a{background:var(--sf);border-radius:10px;padding:20px 16px;text-decoration:none}.gc a:hover{background:var(--line)}.gc b{display:block;font:500 1.1rem var(--serif)}.gc span{color:var(--mut);font-size:.82rem}
.rev{font:italic 400 1.05rem/1.5 var(--serif);color:var(--ink)!important}.rev small{display:block;font:400 .8rem var(--sans);margin-top:8px;color:var(--mut)}
details{border-bottom:1px solid var(--line);padding:14px 0}summary{cursor:pointer;font-weight:500}details p,details{color:var(--mut)}summary{color:var(--ink)}
.nl{background:var(--sf);border-radius:16px;padding:48px 24px;margin:80px 0 0;text-align:center}.nl form{display:flex;gap:8px;max-width:420px;margin:16px auto 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
footer{border-top:1px solid var(--line);color:var(--mut);padding:32px 24px;font-size:.88rem}footer div{max-width:1040px;margin:0 auto;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between}footer a{display:block;text-decoration:none}footer a:hover{color:var(--ink)}footer p{margin:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><nav aria-label="Main"><a class="logo" href="#/">Readify</a><button id="burger" aria-expanded="false" aria-label="Menu">Menu</button>
<div class="links" id="links"><a href="#/">Home</a><a href="#/books">Books</a><a href="#/about">About</a><a href="#/contact">Contact</a><a href="#/cart">Cart<span class="badge" id="cc">0</span></a></div></nav></header>
<main id="app" tabindex="-1"></main>
<footer><div><p><b>Readify</b><br>An online book store project<br>by Nazreen Shah, SYBSc IT</p><p><a href="#/books">Books</a><a href="#/about">About</a><a href="#/contact">Contact</a><a href="#/cart">Cart</a></p><p>Built with HTML, CSS and JavaScript</p></div></footer>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const CATS={Fiction:250,Romance:340,Mystery:200,Fantasy:280,"Self-help":40,Academic:170};
const D=[["The Alchemist","Paulo Coelho","Fiction",299,"A shepherd boy travels toward Egypt in search of treasure and his own destiny."],
["To Kill a Mockingbird","Harper Lee","Fiction",349,"A young girl watches her father defend a man in a prejudiced Southern town."],
["The Kite Runner","Khaled Hosseini","Fiction",399,"A story of friendship, guilt and redemption that spans Kabul and California."],
["Pride and Prejudice","Jane Austen","Romance",199,"Elizabeth Bennet and Mr. Darcy must overcome pride and first impressions."],
["The Notebook","Nicholas Sparks","Romance",329,"An enduring love story told across decades."],
["Me Before You","Jojo Moyes","Romance",379,"A caregiver and her patient change each other's view of life."],
["And Then There Were None","Agatha Christie","Mystery",249,"Ten strangers on an island are removed one by one."],
["The Girl with the Dragon Tattoo","Stieg Larsson","Mystery",429,"A journalist and a hacker investigate a decades-old disappearance."],
["Gone Girl","Gillian Flynn","Mystery",359,"A wife vanishes, and suspicion falls on her husband."],
["The Hobbit","J.R.R. Tolkien","Fantasy",399,"Bilbo Baggins joins a band of dwarves to reclaim a mountain from a dragon."],
["Harry Potter and the Philosopher's Stone","J.K. Rowling","Fantasy",449,"A boy discovers he is a wizard and starts at Hogwarts."],
["A Game of Thrones","George R.R. Martin","Fantasy",499,"Noble houses fight for power in the Seven Kingdoms."],
["Atomic Habits","James Clear","Self-help",499,"Small daily changes that add up to remarkable results."],
["The 7 Habits of Highly Effective People","Stephen R. Covey","Self-help",399,"Principles for personal and professional effectiveness."],
["Ikigai","Héctor García & Francesc Miralles","Self-help",299,"The Japanese idea of finding purpose for a long, happy life."],
["Introduction to Algorithms","Cormen, Leiserson, Rivest, Stein","Academic",1299,"A comprehensive reference on algorithms and data structures."],
["Operating System Concepts","Silberschatz, Galvin, Gagne","Academic",899,"The core ideas behind processes, memory and file systems."],
["Computer Networks","Andrew S. Tanenbaum","Academic",799,"How data moves from applications to cables and back."]
].map(([t,a,c,p,d],i)=>({i,t,a,c,p,d}));
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr=n=>"₹"+n.toLocaleString("en-IN");
let cart=[],cat="All",q="";
try{cart=JSON.parse(localStorage.getItem("readify-cart")||"[]").filter(x=>D[x.i])}catch{}
const save=()=>{try{localStorage.setItem("readify-cart",JSON.stringify(cart))}catch{}$("#cc").textContent=cart.reduce((a,x)=>a+x.q,0)};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),1800)}
const ART={Fiction:'<path d="M50 30C38 22 22 22 12 26v46c10-4 26-4 38 4 12-8 28-8 38-4V26C78 22 62 22 50 30zM50 30v46"/>',Romance:'<path d="M50 80C20 58 14 40 26 30c9-7 20-2 24 6 4-8 15-13 24-6 12 10 6 28-24 50z"/>',Mystery:'<circle cx="42" cy="42" r="22"/><path d="M58 58l26 26"/>',Fantasy:'<path d="M22 84V44h10v-8h8v8h20v-8h8v8h10v40zM44 84V64a6 6 0 0112 0v20"/>',"Self-help":'<circle cx="50" cy="42" r="22"/><path d="M40 68h20v8H40zM44 80h12"/>',Academic:'<path d="M50 24L10 44l40 20 40-20zM26 56v16c14 10 34 10 48 0V56L50 68z"/>'};
const cover=b=>`<a class="cv" style="--h:${CATS[b.c]}" href="#/book/${b.i}" aria-label="View ${esc(b.t)}"><svg class="art" viewBox="0 0 100 100" aria-hidden="true">${ART[b.c]}</svg><b>${esc(b.t)}</b><i>${esc(b.a)}</i></a>`;
const card=b=>`<article class="card">${cover(b)}<div class="ci"><h3>${esc(b.t)}</h3><p>${esc(b.a)}</p><span class="pr">${inr(b.p)}</span><div class="r"><a class="btn s o" href="#/book/${b.i}">Details</a><button class="btn s" data-add="${b.i}">Add to cart</button></div></div></article>`;
const chips=()=>["All",...Object.keys(CATS)].map(c=>`<button class="chip" data-cat="${c}" aria-pressed="${c===cat}">${c}</button>`).join("");
const home=()=>{const sec=(t,ids)=>`<h2 class="t">${t}</h2><div class="grid">${ids.map(i=>card(D[i])).join("")}</div>`;
 return `<section class="hero"><h1>Welcome to Readify</h1><p>Your online book store. Search for a book, pick a genre and add your favourites to the cart.</p><form id="hs"><input id="hq" placeholder="Search by title or author" aria-label="Search books"><button class="btn">Search</button></form></section>
<div class="offer">Explore ${D.length} books across ${Object.keys(CATS).length} genres</div>
<h2 class="t" style="margin-top:56px">Shop by genre</h2><div class="gc">${Object.keys(CATS).map(c=>`<a href="#/books" data-go="${c}" style="--h:${CATS[c]}"><b>${c}</b><span>${D.filter(b=>b.c===c).length} books</span></a>`).join("")}</div>
${sec("Featured books",[0,3,6,9,12,15])}${sec("Popular picks",[12,10,3,0])}${sec("New arrivals",[14,15,16,17])}
<h2 class="t">Why choose Readify?</h2><div class="three"><div><h3>Many genres</h3>Fiction, Romance, Mystery, Fantasy, Self-help and Academic in one place.</div><div><h3>Easy search</h3>Type a title or an author and the list updates.</div><div><h3>Simple cart</h3>Add, remove and change quantities any time.</div><div><h3>Clear details</h3>Every book has its own page with a short description.</div></div>
<h2 class="t">How it works</h2><div class="three"><div><h3>Step 1: Find</h3>Search or browse a genre.</div><div><h3>Step 2: Choose</h3>Open a book and read about it.</div><div><h3>Step 3: Add</h3>Put it in your cart and check the total.</div></div>
<h2 class="t">What readers say</h2><div class="three"><div class="rev">"Really easy to find a book by its author."<small>Sample review, Aditi</small></div><div class="rev">"The cart is simple and the total updates right away."<small>Sample review, Rohan</small></div><div class="rev">"Nice to have all the genres on one page."<small>Sample review, Sana</small></div></div>
<h2 class="t">Frequently asked questions</h2><details><summary>Do I need an account?</summary>No. You can browse and use the cart without logging in.</details><details><summary>Can I pay online?</summary>Not yet. Payment is planned for a future version.</details><details><summary>Will my cart be saved?</summary>Yes, it is stored in your browser, so it stays if you reload the page.</details>
`};
const shown=()=>D.filter(b=>(cat==="All"||b.c===cat)&&(!q||(b.t+" "+b.a).toLowerCase().includes(q.toLowerCase())));
function fill(){const r=shown();$("#res").innerHTML=r.length?`<div class="grid">${r.map(card).join("")}</div>`:`<div class="empty"><h3>No books found</h3><p>Try another title, author or genre.</p></div>`}
const catalog=()=>`<h2 class="t" style="margin-top:36px">Book catalog</h2><div class="bar"><input id="q" type="search" placeholder="Search by title or author" aria-label="Search by title or author" value="${esc(q)}"></div><div class="cats" id="ch" style="margin-bottom:20px">${chips()}</div><div id="res"></div>`;
function detail(i){const b=D[i];if(!b)return`<div class="empty"><h3>Book not found</h3><a href="#/books">Back to the catalog</a></div>`;
 return `<div class="det">${cover(b).replace('href="#/book/'+i+'"','href="#/book/'+i+'" tabindex="-1"')}<div><a href="#/books" class="link">← All books</a><h1>${esc(b.t)}</h1><p style="color:var(--mut);font-size:1.1rem;margin:0">by ${esc(b.a)}</p><p>${esc(b.d)}</p><p><span class="chip">${b.c}</span></p><p class="pr" style="font-size:1.6rem">${inr(b.p)}</p><button class="btn" data-add="${i}">Add to cart</button></div></div>
 <h2 class="t">More in ${b.c}</h2><div class="grid">${D.filter(x=>x.c===b.c&&x.i!==i).map(card).join("")}</div>`}
function cartView(){if(!cart.length)return`<div class="empty"><h2>Your cart is empty</h2><p>Add a few books to see them here.</p><a class="btn" href="#/books">Browse books</a></div>`;
 const tot=cart.reduce((a,x)=>a+D[x.i].p*x.q,0);
 return `<h2 class="t" style="margin-top:36px">Your cart</h2>${cart.map(x=>{const b=D[x.i];return `<div class="row">${cover(b)}<div><strong>${esc(b.t)}</strong><br><span style="color:var(--mut)">${esc(b.a)} · ${inr(b.p)}</span><div class="q"><button data-dec="${x.i}" aria-label="Decrease quantity">−</button><span aria-live="polite">${x.q}</span><button data-inc="${x.i}" aria-label="Increase quantity">+</button> <button class="link" data-rm="${x.i}">Remove</button></div></div><strong>${inr(b.p*x.q)}</strong></div>`}).join("")}
 <div class="total"><span>Total</span><span>${inr(tot)}</span></div><button class="btn" data-order>Place demo order</button> <button class="btn o" data-clear>Clear cart</button><p style="color:var(--mut)">Payments aren't part of this version, so the demo order only empties the cart.</p>`}
const about=()=>`<h2 class="t" style="margin-top:36px">About Readify</h2><p style="max-width:62ch">Readers shouldn't have to visit several stores to find one book. Readify brings books from different genres into one organised place, where you can search, read the details and collect your picks in a cart.</p><div class="three"><div><h3>Browse</h3>Six genres, from Fiction to Academic.</div><div><h3>Search</h3>Find any book by title or author.</div><div><h3>Choose</h3>Add books to the cart and change quantities.</div></div>`;
const contact=()=>`<h2 class="t" style="margin-top:36px">Contact us</h2><form class="f" id="cf" novalidate><div id="cm" hidden></div><label>Name<input name="n" autocomplete="name"></label><label>Email<input name="e" type="email" autocomplete="email"></label><label>Message<textarea name="m" rows="5"></textarea></label><button class="btn">Send message</button><p style="color:var(--mut);margin:0">This demo has no mail server, so messages are checked but not sent.</p></form>`;
function route(){const [,p,id]=(location.hash||"#/").slice(1).split("/"),a=$("#app");$("#links").classList.remove("open");
 document.querySelectorAll(".links a").forEach(l=>l.classList.toggle("on",l.getAttribute("href")==="#/"+(p||"")));
 if(!p){a.innerHTML=home();$("#hs").onsubmit=e=>{e.preventDefault();q=$("#hq").value;cat="All";location.hash="#/books"}}else if(p==="books"){a.innerHTML=catalog();fill();$("#q").oninput=e=>{q=e.target.value;fill()}}
 else if(p==="book")a.innerHTML=detail(+id);else if(p==="cart")a.innerHTML=cartView();else if(p==="about")a.innerHTML=about();
 else if(p==="contact"){a.innerHTML=contact();$("#cf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),m=$("#cm"),n=f.get("n").trim(),em=f.get("e").trim(),ms=f.get("m").trim();m.hidden=false;
  if(!n||!/^\S+@\S+\.\S+$/.test(em)||!ms){m.className="msg bad";m.textContent="Please enter your name, a valid email and a message.";return}
  m.className="msg";m.textContent="Thanks, "+n+"! Your message is ready to send.";e.target.reset()}}
 else a.innerHTML=`<div class="empty"><h3>Page not found</h3><a href="#/">Go home</a></div>`;
 scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("[data-add],[data-inc],[data-dec],[data-rm],[data-cat],[data-go],[data-order],[data-clear],#burger");if(!t)return;const d=t.dataset,g=i=>cart.find(x=>x.i===+i);
 if(d.add!==undefined){const x=g(d.add);x?x.q++:cart.push({i:+d.add,q:1});save();toast("Added to cart")}
 else if(d.inc!==undefined){g(d.inc).q++;save();route()}
 else if(d.dec!==undefined){const x=g(d.dec);x.q--;if(x.q<1)cart=cart.filter(y=>y!==x);save();route()}
 else if(d.rm!==undefined){cart=cart.filter(x=>x.i!==+d.rm);save();route()}
 else if(d.cat){cat=d.cat;$("#ch").innerHTML=chips();fill()}
 else if(d.go){cat=d.go}
 else if(t.hasAttribute("data-order")){cart=[];save();$("#app").innerHTML=`<div class="empty"><h2>Demo order placed</h2><p>Thank you! No payment was taken.</p><a class="btn" href="#/books">Keep browsing</a></div>`}
 else if(t.hasAttribute("data-clear")){cart=[];save();route()}
 else if(t.id==="burger"){t.setAttribute("aria-expanded",$("#links").classList.toggle("open"))}});
addEventListener("hashchange",route);save();route();
</script>
</body>
</html>
